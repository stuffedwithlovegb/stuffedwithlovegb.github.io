<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Stuff At Home Orders | SWL</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><link href="style.css?v=20261008-shop" rel="stylesheet"></head><body style="padding-top:0"><main class="swl-shop"><section class="swl-shop-wrap swl-shop-section"><span class="eyebrow">STUFFED WITH LOVE · OWNER VIEW</span><h1>Stuff At Home orders</h1><p>Enter the separate shop admin key you saved in Cloudflare as SHOP_ADMIN_TOKEN. This is not your Square or Shippo token.</p><form id="owner-login" class="swl-checkout-card"><label>Shop admin key<input type="password" id="owner-key" autocomplete="off" required></label><button type="submit" class="btn btn-primary" style="margin-top:15px">Load Orders</button></form><p id="owner-status" role="status"></p><div id="owner-orders"></div></section></main><script>
const escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n/100);const names={teddy:'Honey Teddy',dog:'Golden Retriever',dino:'Dino',unicorn:'Unicorn'};const child=c=>(c.productName||names[c.productId]||c.productId)+(c.shirt?' · Name shirt: '+c.shirtName:'')+(c.recorder?' · Voice recorder':'');
document.getElementById('owner-login').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('owner-status');status.textContent='Loading…';try{const r=await fetch('/shop/api/admin-orders',{headers:{Authorization:'Bearer '+document.getElementById('owner-key').value},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not load orders.');document.getElementById('owner-orders').innerHTML=d.orders.map(o=>{const a=o.address;return `<article class="swl-checkout-card"><span class="eyebrow">${escapeText(o.status.toUpperCase())}${o.test?' · PRACTICE ORDER':''}</span><h2>${escapeText(o.id)}</h2><p>${escapeText(new Date(o.createdAt).toLocaleString())}</p><p><strong>${escapeText(a.name)}</strong><br>${escapeText(a.email)} · ${escapeText(a.phone)}<br>${escapeText(a.street1)} ${escapeText(a.street2)}<br>${escapeText(a.city)}, ${escapeText(a.state)} ${escapeText(a.zip)}</p>${o.cart.map(line=>`<div class="swl-receipt-line"><strong>${line.quantity} × ${line.kind==='birthday'?'Birthday Box (10 kits)':escapeText(child(line))}</strong>${line.kind==='birthday'?'<ol>'+line.children.map(c=>'<li>'+escapeText(child(c))+'</li>').join('')+'</ol>':''}</div>`).join('')}<p>Items ${money(o.subtotal)} · Shipping ${money(o.selectedRate.amount)} · Tax ${money(o.selectedRate.tax)}<br><strong>Total ${money(o.total)}</strong><br>${escapeText(o.selectedRate.provider)} · ${escapeText(o.selectedRate.service)}</p><p class="swl-fine">${o.test?'Do not ship practice orders.':'Buy the label in Shippo’s shipping app using these delivery details and the actual packed dimensions. This page does not automatically buy labels or change Ops inventory.'}</p></article>`;}).join('');status.textContent=d.orders.length?'Showing the latest '+d.orders.length+' orders.':'No paid or attempted orders yet.';}catch(err){status.textContent=err.message;}});
</script></body></html>
