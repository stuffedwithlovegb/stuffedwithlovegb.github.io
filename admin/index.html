<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#F6E9CD" />

  <title>Stuffed With Love Ops</title>

  <link rel="stylesheet" href="admin.css" />
</head>

<body>

  <div id="app">

    <header class="topbar">

      <div>
        <div class="eyebrow">STUFFED WITH LOVE</div>
        <h1 id="pageTitle">Ops</h1>
      </div>

      <button
        id="headerAction"
        class="icon-button hidden"
        type="button"
      >
        +
      </button>

    </header>

    <main
      id="mainContent"
      class="main-content"
    ></main>

    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-screen="home"
      >
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </button>

      <button
        class="nav-item"
        data-screen="events"
      >
        <span class="nav-icon">◫</span>
        <span>Events</span>
      </button>

      <button
        class="nav-item"
        data-screen="inventory"
      >
        <span class="nav-icon">▦</span>
        <span>Inventory</span>
      </button>

      <button
        class="nav-item"
        data-screen="attention"
      >
        <span class="nav-icon">!</span>
        <span>Attention</span>

        <span
          id="attentionBadge"
          class="nav-badge hidden"
        >
          0
        </span>
      </button>

    </nav>

  </div>

  <div id="modalRoot"></div>

  <script src="app.js"></script>

</body>
</html>
